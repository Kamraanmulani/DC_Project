# =============================================================================
# Distributed Computing Lab - Experiment 10: Kubernetes Cluster Manifests
# Complete ChessMate System: Headless Worker Pool, Raft Cluster, Backend & Redis
# =============================================================================

# -----------------------------------------------------------------------------
# 1. STATELESS WORKER POOL (EXP 6 & 10)
# Scaled to 3 Replicas with Headless Service for Client-Side gRPC Round Robin
# -----------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  labels:
    app: worker
spec:
  replicas: 3
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
      - name: worker
        image: myapp-backend:latest
        imagePullPolicy: Never
        command: ["python", "-u", "worker_server.py", "60201"]
        ports:
        - containerPort: 60201
---
apiVersion: v1
kind: Service
metadata:
  name: worker
spec:
  clusterIP: None  # HEADLESS SERVICE: Allows DNS to return all 3 pod IPs for gRPC LB
  selector:
    app: worker
  ports:
  - name: grpc
    port: 60201
    targetPort: 60201

