syntax = "proto3";

package artwork;

// Artwork Service
service ArtworkService {
  rpc SubmitArtwork (SubmissionRequest) returns (SubmissionReply);
}

message SubmissionRequest {
  int32 artist_id = 1;
  string title = 2;
}

message SubmissionReply {
  bool success = 1;
  string message = 2;
}

// Peer-to-peer mutual exclusion service.
// Every Artist node runs this server AND calls it on its peers.
service MutexService {
  rpc RequestAccess (AccessRequest) returns (AccessReply);
}

message AccessRequest {
  int32 node_id = 1;
  int32 timestamp = 2;
}

message AccessReply {
  int32 node_id = 1;
  int32 timestamp = 2;
}

// --- Experiment 5: Deadlock simulation & resolution ---
service LockService {
  rpc AcquireLock (LockRequest) returns (LockReply);
  rpc ReleaseLock (LockRequest) returns (LockReply);
}

message LockRequest {
  string resource_id = 1;
  int32 holder_id = 2;
  int32 timestamp = 3;
}

message LockReply {
  bool granted = 1;
  string message = 2;
}
