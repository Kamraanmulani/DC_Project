syntax = "proto3";

package eventual_demo;

// Distributed Computing Lab - Experiment 7: Eventual Consistency
// Replicated key-value style store using Gossip Replication + Last-Write-Wins (LWW).
// Each replica exposes the same three RPCs to clients AND to its peer replicas.
service ReplicaService {
  rpc SaveValue (ValueUpdate) returns (SaveAck);    // client -> replica (local write)
  rpc SyncUpdate (ValueUpdate) returns (SaveAck);    // replica -> replica (gossip)
  rpc GetValue (ValueQuery) returns (ValueState);   // read current state
}

message ValueUpdate {
  string key = 1;
  string content = 2;
  int32 lamport_timestamp = 3;
  string origin_replica = 4;
}

message SaveAck {
  bool accepted = 1;
  string replica = 2;
  int32 lamport_timestamp = 3;
}

message ValueQuery {
  string key = 1;
}

message ValueState {
  string key = 1;
  string content = 2;
  int32 lamport_timestamp = 3;
  string origin_replica = 4;
}
