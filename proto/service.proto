syntax = "proto3";

package lb_demo;

// Distributed Computing Lab - Experiment 6: Load Balancing (Least Connections)
// A generic backend worker service. Multiple identical instances run concurrently;
// the Load Balancer routes requests based on real-time active connection counts.
service WorkerService {
  rpc HandleRequest (WorkRequest) returns (WorkReply);
}

message WorkRequest {
  int32 request_id = 1;
}

message WorkReply {
  int32 request_id = 1;
  string handled_by = 2;
  string status = 3;
}
