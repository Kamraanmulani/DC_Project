syntax = "proto3";

package chessmate;

// Chess Service RPC Definition for Experiment 2
service ChessService {
  // RPC to create a new multiplayer chess game room
  rpc CreateRoom (CreateRoomRequest) returns (CreateRoomResponse);

  // RPC to validate and execute a chess move
  rpc MakeMove (MakeMoveRequest) returns (MakeMoveResponse);

  // RPC to fetch the current game state and board status
  rpc GetGameState (GetGameStateRequest) returns (GetGameStateResponse);
}

// Request to create a game room
message CreateRoomRequest {
  string room_name = 1;
  string player_email = 2;
  string player_color = 3;
}

// Response from room creation
message CreateRoomResponse {
  string room_code = 1;
  string game_id = 2;
  string status = 3;
  string message = 4;
}

// Request to make a chess move
message MakeMoveRequest {
  string room_code = 1;
  string player_color = 2;
  string from_square = 3;
  string to_square = 4;
  string promotion = 5;
}

// Response after move attempt
message MakeMoveResponse {
  bool is_valid = 1;
  string move_san = 2;
  string current_fen = 3;
  string current_turn = 4;
  bool is_check = 5;
  bool is_checkmate = 6;
  bool is_game_over = 7;
  string message = 8;
}

// Request to get full game state
message GetGameStateRequest {
  string room_code = 1;
}

// Response containing full game state
message GetGameStateResponse {
  string room_code = 1;
  string status = 2;
  string current_turn = 3;
  string fen = 4;
  int32 move_count = 5;
  repeated string move_history = 6;
  string message = 7;
}

// Peer-to-peer mutual exclusion service for Experiment 4
// Every node runs this server AND calls it on its peers.
service MutexService {
  rpc RequestAccess (AccessRequest) returns (AccessReply);
}

message AccessRequest {
  int32 node_id = 1;
  int32 timestamp = 2;
}

message AccessReply {
  int32 node_id = 1;
  int32 timestamp = 2;
}

// --- Experiment 5: Deadlock simulation & resolution ---
service LockService {
  rpc AcquireLock (LockRequest) returns (LockReply);
  rpc ReleaseLock (LockRequest) returns (LockReply);
}

message LockRequest {
  string resource_id = 1;
  int32 holder_id = 2;
  int32 timestamp = 3;
}

message LockReply {
  bool granted = 1;
  string message = 2;
}

